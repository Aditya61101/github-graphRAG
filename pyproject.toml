[project]
name = "github-graphrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aditya Kumar", email = "adityakumarsanni.2001@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "llama-index-core>=0.14.25",
    "markdown-it-py>=4.2.0",
    "neo4j-graphrag[google-genai]>=1.19.0",
    "proto-schema-parser>=2.1.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "treesitter-chunker>=4.0.0",
]

[project.scripts]
github-graphrag = "github_graphrag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "integration: marks integration tests that connect to external services (deselect with '-m \"not integration\"')",
]

