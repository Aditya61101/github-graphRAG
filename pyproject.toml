[project]
name = "github-graphrag"
version = "0.1.0"
description = "GraphRAG over code repositories and their documentation (Neo4j)"
readme = "README.md"
authors = [
    { name = "Aditya Kumar", email = "adityakumarsanni.2001@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "llama-index-core>=0.14.25",
    "neo4j-graphrag[google-genai]>=1.19.0",
    "proto-schema-parser>=2.1.0",
    "python-dotenv>=1.2.3",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "sentence-transformers>=6.1.0",
    "treesitter-chunker>=4.0.0",
]

[project.scripts]
github-graphrag = "github_graphrag:main"
codegraph = "github_graphrag.codegraph.cli:main"

[dependency-groups]
dev = [
    "falkordblite>=0.1.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
