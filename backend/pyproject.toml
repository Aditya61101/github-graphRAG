[project]
name = "github-graphrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aditya Kumar", email = "adityakumarsanni.2001@gmail.com" }
]
requires-python = ">=3.13"

dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "markdown-it-py>=4.2.0",
    "neo4j-graphrag[google-genai]>=1.19.0",
    "proto-schema-parser>=2.1.0",
    "python-dotenv>=1.2.3",
    "treesitter-chunker>=4.0.0",
    "authlib>=1.8.0",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.3",
    "torch>=2.6",
    "transformers>=4.51.0,<5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["ai_services/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "integration: marks integration tests that connect to external services (deselect with '-m \"not integration\"')",
]

[tool.uv]
package = false
